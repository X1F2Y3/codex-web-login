[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-web-login"
version = "1.0.0"
description = "用浏览器网页版 accessToken 打通 Codex 的 ChatGPT 通道，绕过 OAuth 手机号墙"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "codex-web-login contributors" }]
keywords = ["codex", "chatgpt", "openai", "auth", "token"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/X1F2Y3/codex-web-login"
Documentation = "https://github.com/X1F2Y3/codex-web-login#readme"
Issues = "https://github.com/X1F2Y3/codex-web-login/issues"
Changelog = "https://github.com/X1F2Y3/codex-web-login/blob/main/CHANGELOG.md"
"机制分析" = "https://github.com/X1F2Y3/codex-web-login/blob/main/docs/MECHANISM.md"

[project.scripts]
codex-web-login = "codex_web_login.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 `pytest` 在未执行 `pip install -e .` 时也能直接跑（clone 即测）
pythonpath = ["src"]
